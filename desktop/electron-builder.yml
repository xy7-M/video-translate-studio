appId: com.mengxiaoyao.videotranslate
productName: 视频快译
copyright: Copyright © 2026 mengxiaoyao

asar: true
compression: maximum

directories:
  # 每版本独立输出目录，避免旧 win-unpacked exe 被占用导致清理失败
  output: dist/${version}
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - package.json

# Next standalone 服务 / 转写脚本 / 便携 Python + ffmpeg 全部放到 resources（不进 asar）
extraResources:
  - from: .stage/server
    to: server
  - from: .stage/scripts
    to: scripts
  - from: runtime/python
    to: runtime/python
  - from: runtime/ffmpeg
    to: runtime/ffmpeg

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false              # 图形向导（非一键静默）
  perMachine: false            # 安装到当前用户，免 UAC
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 视频快译
  deleteAppDataOnUninstall: false  # 卸载保留用户视频与任务数据
  language: "2052"            # 简体中文安装向导
  include: build/installer.nsh
  artifactName: VideoTranslate-Setup-${version}.${ext}

# macOS 构建（由 GitHub Actions macos-latest runner 触发，本机不打 mac 包）
mac:
  target:
    - target: dmg
      arch: [x64]
  category: public.app-category.education
  hardenedRuntime: false          # 未做代码签名，关闭 hardened runtime 避免 Gatekeeper 拦截
  gatekeeperAssess: false
  identity: null                  # 不签名（无 Apple Developer 证书）
  artifactName: VideoTranslate-${version}-macOS.${ext}

# 仅用于生成 latest.yml；真正的 feed 地址由主进程 setFeedURL 控制
# 与 desktop/main.cjs 的 DEFAULT_FEED 保持一致（COS 公有读对象目录）
publish:
  - provider: generic
    url: https://mengxiaoyao-vts-1455284621.cos.ap-beijing.myqcloud.com/feed/
